<style>
@font-face { font-family: 'Exo'; font-weight: 300 900; font-display: swap; src: url(assets/fonts/exo-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: 'Exo'; font-weight: 300 900; font-display: swap; src: url(assets/fonts/exo-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

:root {
  --navy: #0b1f33; --ink: #05101b; --blue: #225aa7; --green: #01a65c; --green-2: #19c37a;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--ink); color: #fff; overflow: hidden; overscroll-behavior: none; }
body { font-family: 'Exo', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { -webkit-user-drag: none; }
.ico { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.view { position: fixed; inset: 0; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s linear .35s, transform .35s ease; transform: scale(1.015); }
.view.active { opacity: 1; visibility: visible; transform: none; transition: opacity .35s ease, visibility 0s, transform .35s ease; }
@media (prefers-reduced-motion: reduce) { .view { transition: none !important; transform: none !important; } }

/* ---------- home ---------- */
#home { display: flex; background: #000; }
.half { position: relative; flex: 1; overflow: hidden; text-align: left; display: flex; align-items: flex-end; }
.half .bg { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
.half:active .bg { transform: scale(1.04); }
.half .shade { position: absolute; inset: 0; }
.half.c .bg { background-image: url(assets/img/home-clarivent.jpg); background-position: 45% center; }
.half.c .shade { background: linear-gradient(180deg, rgba(3,10,18,.15) 0%, rgba(3,10,18,.35) 45%, rgba(3,10,18,.92) 100%); }
.half.d .bg { background-image: url(assets/img/home-davlumbaz.jpg); background-position: 40% center; }
.half.d .shade { background: linear-gradient(180deg, rgba(3,10,18,.25) 0%, rgba(3,10,18,.45) 45%, rgba(3,10,18,.94) 100%); }
.divider { position: relative; width: 6px; flex: none; background: linear-gradient(180deg, var(--blue), var(--green)); z-index: 2; }
.half .content { position: relative; padding: 0 calc(48px + var(--sr)) calc(56px + var(--sb)) calc(48px + var(--sl)); width: 100%; }
.half.d .content { padding-left: 48px; }
.kicker { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--green-2); }
.kicker::before { content: ""; width: 30px; height: 3px; border-radius: 2px; background: currentColor; }
.half h2 { font-size: clamp(40px, 5.4vw, 64px); font-weight: 800; line-height: 1; margin: 14px 0 12px; letter-spacing: -.01em; }
.half p { font-size: 17px; line-height: 1.5; color: rgba(255,255,255,.8); font-weight: 500; max-width: 440px; }
.half .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 26px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 700;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.chip .ico { width: 17px; height: 17px; color: var(--green-2); }
.go { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--green); box-shadow: 0 10px 30px rgba(1,166,92,.45); }
.go .ico { width: 28px; height: 28px; stroke-width: 2.6; }
.topbar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; justify-content: center; align-items: center;
  padding: calc(18px + var(--st)) 24px 18px; pointer-events: none;
  background: linear-gradient(180deg, rgba(3,10,18,.75), rgba(3,10,18,0)); }
.topbar img { height: 40px; width: auto; }
.status { position: absolute; right: calc(20px + var(--sr)); top: calc(20px + var(--st)); display: flex; align-items: center; gap: 8px; pointer-events: auto;
  padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; background: rgba(5,16,27,.7); border: 1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: #f2b233; }
.status.ok .dot { background: var(--green-2); box-shadow: 0 0 0 4px rgba(25,195,122,.2); }
.status.err .dot { background: #e5533d; }
.status .bar { width: 90px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.15); overflow: hidden; }
.status .bar i { display: block; height: 100%; width: 0; background: var(--green-2); transition: width .3s; }
.status.ok .bar { display: none; }
@media (orientation: portrait) {
  #home { flex-direction: column; }
  .divider { width: auto; height: 6px; background: linear-gradient(90deg, var(--blue), var(--green)); }
  .half .content, .half.d .content { padding: 0 40px 40px; }
  .half.c .content { padding-bottom: 36px; }
  .half.c .bg { background-image: url(assets/img/hero-clarivent.jpg); background-position: 70% center; }
  .half.d .bg { background-image: url(assets/img/hero-davlumbaz.jpg); }
}

/* ---------- section ---------- */
#section { background: var(--ink); }
#section .bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
#section .shade { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(3,10,18,.96) 0%, rgba(3,10,18,.85) 40%, rgba(3,10,18,.35) 75%, rgba(3,10,18,.2) 100%); }
.back { position: absolute; left: calc(20px + var(--sl)); top: calc(20px + var(--st)); z-index: 5; display: flex; align-items: center; gap: 8px;
  height: 52px; padding: 0 20px 0 14px; border-radius: 16px; font-size: 16px; font-weight: 700;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
.back:active, .opt:active, .go:active, .icon-btn:active { transform: scale(.96); }
#section .logo { position: absolute; right: calc(28px + var(--sr)); top: calc(26px + var(--st)); height: 38px; width: auto; z-index: 5; }
#section .content { position: absolute; left: calc(64px + var(--sl)); right: calc(64px + var(--sr)); top: 50%; transform: translateY(-46%); max-width: 760px; }
#section h1 { font-size: clamp(44px, 6vw, 76px); font-weight: 800; line-height: 1; margin: 16px 0 16px; letter-spacing: -.01em; }
#section .desc { font-size: 19px; line-height: 1.55; color: rgba(255,255,255,.8); font-weight: 500; max-width: 560px; }
.opts { display: flex; gap: 18px; margin-top: 40px; flex-wrap: wrap; }
.opt { position: relative; width: 300px; min-height: 196px; padding: 24px; border-radius: 24px; text-align: left; display: flex; flex-direction: column;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  transition: transform .15s ease; }
.opt .oi { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, var(--blue), var(--green)); }
.opt .oi .ico { width: 30px; height: 30px; }
.opt b { display: block; margin-top: auto; padding-top: 22px; font-size: 26px; font-weight: 800; }
.opt span { display: block; margin-top: 4px; font-size: 15px; color: rgba(255,255,255,.7); font-weight: 600; }
.opt .arr { position: absolute; right: 22px; top: 26px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); }
.opt.video .oi { background: linear-gradient(135deg, #e5533d, #f2b233); }
.opt.gallery .oi { background: linear-gradient(135deg, #7b5cff, #225aa7); }

/* ---------- gallery ---------- */
#gallery { background: var(--ink); }
.gbar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px;
  padding: calc(20px + var(--st)) calc(28px + var(--sr)) 22px calc(20px + var(--sl));
  background: linear-gradient(180deg, rgba(5,16,27,.98) 55%, rgba(5,16,27,0)); }
#gallery .back { position: static; flex: none; }
.gbar .tt { flex: 1; min-width: 0; }
.gbar h1 { font-size: 26px; font-weight: 800; line-height: 1.1; }
.gbar .n { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.6); margin-top: 2px; }
.gbar .logo { height: 34px; width: auto; flex: none; }
.gscroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding: calc(104px + var(--st)) calc(20px + var(--sr)) calc(28px + var(--sb)) calc(20px + var(--sl)); }
.ggrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.ggrid button { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; background: #0d1a27; }
.ggrid img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s, transform .2s; }
.ggrid img.ld { opacity: 1; }
.ggrid button:active img { transform: scale(.96); }
@media (orientation: portrait) { .ggrid { grid-template-columns: repeat(3, 1fr); } }

/* ---------- viewer ---------- */
#viewer { background: #000; touch-action: none; }
.track { position: absolute; inset: 0; display: flex; will-change: transform; }
.track.anim { transition: transform .38s cubic-bezier(.2,.75,.2,1); }
.pg { position: relative; flex: none; width: 100vw; height: 100%; overflow: hidden; }
.pg img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; max-width: none; object-fit: contain; opacity: 0; transition: opacity .25s; }
.pg img.ld { opacity: 1; }
.pg img.za { transition: opacity .25s, left .28s cubic-bezier(.2,.75,.2,1), top .28s cubic-bezier(.2,.75,.2,1), width .28s cubic-bezier(.2,.75,.2,1), height .28s cubic-bezier(.2,.75,.2,1); }
#viewer .vbar, #viewer .navbtn, #viewer .hint { transition: opacity .3s; }
#viewer.ui-off .vbar, #viewer.ui-off .navbtn, #viewer.ui-off .hint { opacity: 0; pointer-events: none; }
#viewer.zoomed .navbtn { opacity: 0; pointer-events: none; }
.vbar { position: absolute; left: 0; right: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px;
  padding: calc(12px + var(--st)) calc(16px + var(--sr)) 12px calc(16px + var(--sl)); background: linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,0)); }
.vbar .t { flex: 1; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); flex: none; }
.icon-btn.on { background: var(--green); border-color: var(--green); }
.counter { height: 52px; min-width: 84px; padding: 0 14px; border-radius: 16px; display: grid; place-items: center; font-weight: 700; font-size: 16px;
  font-variant-numeric: tabular-nums; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); }
.navbtn { position: absolute; top: 50%; z-index: 4; width: 56px; height: 56px; margin-top: -28px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); transition: opacity .2s; }
.navbtn.prev { left: calc(14px + var(--sl)); } .navbtn.next { right: calc(14px + var(--sr)); }
.navbtn[disabled] { opacity: 0; pointer-events: none; }
.hint { position: absolute; left: 50%; bottom: calc(22px + var(--sb)); transform: translateX(-50%); z-index: 4; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.55);
  letter-spacing: .04em; white-space: nowrap; }
.thumbs { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch;
  padding: 16px calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl)); background: rgba(5,16,27,.94);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); transform: translateY(105%); transition: transform .3s ease; }
.thumbs.open { transform: none; }
.thumbs button { flex: none; position: relative; border-radius: 10px; overflow: hidden; border: 2px solid transparent; background: #111; }
.thumbs button.on { border-color: var(--green-2); }
.thumbs img { display: block; height: 110px; width: auto; }
.thumbs button span { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.7); }

/* ---------- player ---------- */
#player { background: #000; }
#player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
#player .vbar { pointer-events: none; transition: opacity .3s; }
#player .vbar > * { pointer-events: auto; }
#player.playing .vbar.dim { opacity: 0; }
#player .err { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 40px; font-size: 18px; color: rgba(255,255,255,.8); }
#player.failed .err { display: grid; }
</style>
</head>

    show('player');
    var p = video.play(); if (p && p.catch) p.catch(function () {});
  }
  video.addEventListener('error', function () {
    if (blobUrl || !video.dataset.src || !window.caches) { views.player.classList.add('failed'); return; }
    caches.open(CACHE).then(function (c) { return c.match(video.dataset.src); }).then(function (r) {
      if (!r) throw new Error('missing');
      return r.blob();
    }).then(function (b) {
      blobUrl = URL.createObjectURL(b); video.src = blobUrl; video.play().catch(function () {});
    }).catch(function () { views.player.classList.add('failed'); });
  });
  video.addEventListener('play', function () { views.player.classList.add('playing'); poke(); });
  video.addEventListener('pause', function () { $('pBar').classList.remove('dim'); });
  video.addEventListener('ended', function () { $('pBar').classList.remove('dim'); });
  function poke() { $('pBar').classList.remove('dim'); clearTimeout(dimTimer); dimTimer = setTimeout(function () { if (!video.paused) $('pBar').classList.add('dim'); }, 2500); }
  views.player.addEventListener('touchstart', poke, { passive: true });
  $('pClose').addEventListener('click', function () {
    video.pause(); video.removeAttribute('src'); video.load();
    if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
    show('section');
  });

  document.addEventListener('keydown', function (e) {
    if (current === 'viewer') {
      if (e.key === 'ArrowRight' || e.key === ' ') goPage(cur + 1, true);
      else if (e.key === 'ArrowLeft') goPage(cur - 1, true);
      else if (e.key === 'Escape') $('vClose').click();
    } else if (e.key === 'Escape') {
      if (current === 'player') $('pClose').click(); else if (current === 'gallery') show('section'); else if (current === 'section') show('home');
    }
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  /* ---------- offline download ---------- */
  var statusEl = $('status'), statusText = $('statusText'), statusBar = $('statusBar');
  function setStatus(kind, text, pct) {
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
    statusText.textContent = text;
    if (pct != null) statusBar.style.width = pct + '%';
  }

  function mb(n) { return (n / 1048576).toFixed(0); }

  function downloadAll() {
    if (!window.caches || !window.fetch) { setStatus('err', 'Çevrimdışı desteklenmiyor'); return; }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    var cache, missing = [], total = 0, done = 0;
    caches.open(CACHE).then(function (c) {
      cache = c;
      return Promise.all(ASSETS.map(function (a) {
        return c.match(a.url).then(function (r) {
          if (r) return false;
          return caches.match(a.url).then(function (old) {
            if (old && old.headers.get('Content-Length') === String(a.size)) return c.put(a.url, old).then(function () { return false; });
            return true;
          });
        });
      }));
    }).then(function (need) {
      ASSETS.forEach(function (a, i) { if (need[i]) { missing.push(a); total += a.size; } });
      if (!missing.length) { setStatus('ok', 'Çevrimdışı hazır'); return pruneOld(); }
      setStatus('', 'İndiriliyor %0', 0);
      var chain = Promise.resolve();
      missing.forEach(function (a) {
        chain = chain.then(function () {
          return fetch(a.url, { cache: 'reload' }).then(function (res) {
            if (!res.ok) throw new Error(a.url);
            var type = res.headers.get('Content-Type') || '';
            if (!res.body || !res.body.getReader) {
              return res.blob().then(function (b) { done += a.size; return b; });
            }
            var reader = res.body.getReader(), parts = [];
            function pump() {
              return reader.read().then(function (r) {
                if (r.done) return new Blob(parts, { type: type });
                parts.push(r.value); done += r.value.length;
                var pct = Math.min(99, Math.round(done / total * 100));
                setStatus('', 'İndiriliyor %' + pct + ' (' + mb(done) + '/' + mb(total) + ' MB)', pct);
                return pump();
              });
            }
            return pump();
          }).then(function (blob) {
            return cache.put(a.url, new Response(blob, { headers: { 'Content-Type': blob.type || 'application/octet-stream', 'Content-Length': String(blob.size) } }));
          });
        });
      });
      return chain.then(function () { setStatus('ok', 'Çevrimdışı hazır', 100); return pruneOld(); });
    }).catch(function () {
      setStatus('err', navigator.onLine ? 'İndirme yarım kaldı · tekrar deneniyor' : 'İnternet yok · indirme tamamlanmadı');
      setTimeout(downloadAll, 8000);
    });
  }

  function pruneOld() {
    return caches.keys().then(function (keys) {
      return Promise.all(keys.filter(function (k) { return k.indexOf('acc-fuar-assets-') === 0 && k !== CACHE; })
        .map(function (k) { return caches.delete(k); }));
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  window.addEventListener('load', function () { setTimeout(downloadAll, 300); });
})();
</script>
</body>
</html>
